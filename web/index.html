<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The Bible Game - Test Your Knowledge of God's Word">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Bible Game">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>The Bible Game</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="The Bible Game">
  <meta property="og:description" content="Test Your Knowledge of God's Word - Play Bible trivia games, daily devotionals, and more!">
  <meta property="og:type" content="website">

  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#014AA0">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(180deg, #071428 0%, #0D2050 100%);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* ── Mobile: Flutter fills the entire viewport ── */
    #flutter-host {
      width: 100%;
      height: 100%;
    }

    /* ── Desktop: phone-shaped container, centered ── */
    @media (min-width: 501px) {
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #flutter-host {
        --phone-aspect: calc(375 / 812);
        width: calc((100vh - 32px) * (375 / 812));
        max-width: calc(100vw - 32px);
        height: calc(100vh - 32px);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
      }
    }

    /* ── Loading screen ── */
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      background: linear-gradient(180deg, #071428 0%, #0D1E3E 30%, #0A1A3A 65%, #0D2050 100%);
    }
    .loading-title {
      font-family: 'Georgia', serif;
      font-size: 32px;
      color: #FFD700;
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }
    .loading-subtitle {
      font-family: 'Arial', sans-serif;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 30px;
    }
    .loading-bar-track {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .loading-bar-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #FFE57A, #FFD700, #FFA500);
      border-radius: 4px;
      animation: loading 1.5s ease-in-out infinite;
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>

  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- Flutter renders INSIDE this element, so it sees this element's size as the viewport -->
  <div id="flutter-host">
    <div class="loading-container" id="loading">
      <div class="loading-title">THE BIBLE<br>GAME</div>
      <div class="loading-subtitle">Loading...</div>
      <div class="loading-bar-track">
        <div class="loading-bar-fill"></div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      var host = document.getElementById('flutter-host');

      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            hostElement: host,
          }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
