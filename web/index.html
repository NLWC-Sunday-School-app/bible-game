<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="The Bible Game - Test Your Knowledge of God's Word">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Bible Game">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>The Bible Game</title>
  <link rel="manifest" href="manifest.json">

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="The Bible Game">
  <meta property="og:description" content="Test Your Knowledge of God's Word - Play Bible trivia games, daily devotionals, and more!">
  <meta property="og:type" content="website">

  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#014AA0">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(180deg, #071428 0%, #0D2050 100%);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    #flutter-host { width: 100%; height: 100%; }

    @media (min-width: 501px) {
      body { display: flex; justify-content: center; align-items: center; }
      #flutter-host {
        width: calc((100vh - 32px) * (375 / 812));
        max-width: calc(100vw - 32px);
        height: calc(100vh - 32px);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
      }
    }

    /* ── Loading screen ── */
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      background: linear-gradient(180deg, #014AA0 0%, #012E65 40%, #071428 100%);
      position: relative;
      overflow: hidden;
    }

    /* Floating particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 215, 0, 0.15);
      animation: float linear infinite;
    }
    .particle:nth-child(1) { width: 6px; height: 6px; left: 10%; animation-duration: 8s; animation-delay: 0s; }
    .particle:nth-child(2) { width: 4px; height: 4px; left: 25%; animation-duration: 12s; animation-delay: 2s; }
    .particle:nth-child(3) { width: 8px; height: 8px; left: 50%; animation-duration: 10s; animation-delay: 1s; }
    .particle:nth-child(4) { width: 5px; height: 5px; left: 70%; animation-duration: 9s; animation-delay: 3s; }
    .particle:nth-child(5) { width: 7px; height: 7px; left: 85%; animation-duration: 11s; animation-delay: 0.5s; }
    .particle:nth-child(6) { width: 3px; height: 3px; left: 40%; animation-duration: 14s; animation-delay: 4s; }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
    }

    /* Logo */
    .loading-logo {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      margin-bottom: 20px;
      animation: logoEntry 0.8s ease-out, logoPulse 3s ease-in-out 0.8s infinite;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 40px rgba(255, 215, 0, 0.1);
    }

    @keyframes logoEntry {
      0% { transform: scale(0.3) translateY(30px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .loading-title {
      font-family: 'Georgia', serif;
      font-size: 28px;
      color: #FFD700;
      text-align: center;
      letter-spacing: 4px;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
      margin-bottom: 8px;
      animation: titleEntry 0.8s ease-out 0.3s both;
    }
    .loading-tagline {
      font-family: 'Arial', sans-serif;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 2px;
      margin-bottom: 40px;
      animation: titleEntry 0.8s ease-out 0.5s both;
    }

    @keyframes titleEntry {
      0% { transform: translateY(15px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* Did you know section */
    .fact-container {
      width: 85%;
      max-width: 320px;
      text-align: center;
      margin-bottom: 40px;
      min-height: 100px;
      animation: titleEntry 0.8s ease-out 0.7s both;
    }
    .fact-label {
      font-family: 'Arial', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #FFD700;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .fact-text {
      font-family: 'Georgia', serif;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.85);
      transition: opacity 0.5s ease;
    }
    .fact-text.fade-out { opacity: 0; }

    /* Progress bar */
    .progress-section {
      width: 70%;
      max-width: 260px;
      animation: titleEntry 0.8s ease-out 0.9s both;
    }
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #FFD700, #FFA500);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .progress-status {
      font-family: 'Arial', sans-serif;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
    }
  </style>

  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="flutter-host">
    <div class="loading-container" id="loading">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>

      <img class="loading-logo" src="icons/Icon-192.png" alt="The Bible Game">
      <div class="loading-title">THE BIBLE GAME</div>
      <div class="loading-tagline">Test Your Knowledge of God's Word</div>

      <div class="fact-container">
        <div class="fact-label">Did You Know?</div>
        <div class="fact-text" id="fact-text"></div>
      </div>

      <div class="progress-section">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-status" id="progress-status">Preparing your journey...</div>
      </div>
    </div>
  </div>

  <script>
    // Bible facts shown during loading
    var facts = [
      "The Bible contains 66 books written by about 40 authors over 1,500 years.",
      "Psalm 117 is the shortest chapter in the Bible with only 2 verses.",
      "The longest verse in the Bible is Esther 8:9. The shortest is John 11:35 \u2014 \"Jesus wept.\"",
      "The word \"Lord\" appears over 7,000 times in the Bible.",
      "The number 40 appears 146 times in the Bible \u2014 it rained 40 days, Moses spent 40 years in the desert, Jesus fasted 40 days.",
      "Methuselah is the oldest person in the Bible, living to 969 years.",
      "The book of Esther never mentions the name of God directly.",
      "King Solomon is said to have written over 3,000 proverbs and 1,005 songs.",
      "The Bible has been translated into over 700 languages worldwide."
    ];

    var factEl = document.getElementById('fact-text');
    var progressFill = document.getElementById('progress-fill');
    var progressStatus = document.getElementById('progress-status');
    var factIndex = Math.floor(Math.random() * facts.length);

    // Show first fact immediately
    factEl.textContent = facts[factIndex];

    // Rotate facts every 4 seconds
    setInterval(function() {
      factEl.classList.add('fade-out');
      setTimeout(function() {
        factIndex = (factIndex + 1) % facts.length;
        factEl.textContent = facts[factIndex];
        factEl.classList.remove('fade-out');
      }, 500);
    }, 4000);

    // Simulate progress stages
    var stages = [
      { pct: 15, text: "Preparing your journey..." },
      { pct: 35, text: "Loading scriptures..." },
      { pct: 55, text: "Setting up game modes..." },
      { pct: 75, text: "Almost there..." },
      { pct: 90, text: "Finishing up..." }
    ];
    var stageIndex = 0;
    var stageInterval = setInterval(function() {
      if (stageIndex < stages.length) {
        progressFill.style.width = stages[stageIndex].pct + '%';
        progressStatus.textContent = stages[stageIndex].text;
        stageIndex++;
      }
    }, 1500);

    window.addEventListener('load', function(ev) {
      var host = document.getElementById('flutter-host');

      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: null,
        },
        onEntrypointLoaded: function(engineInitializer) {
          clearInterval(stageInterval);
          progressFill.style.width = '100%';
          progressStatus.textContent = 'Ready!';

          engineInitializer.initializeEngine({
            hostElement: host,
          }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
