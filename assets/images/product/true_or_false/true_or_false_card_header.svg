<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <!-- Parchment/scroll banner background -->
  <defs>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D76E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="scrollEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8860B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6914;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#1A1A2E;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#1A1A2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A2E;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Left scroll curl -->
  <ellipse cx="20" cy="40" rx="18" ry="30" fill="url(#scrollEdge)" />
  <ellipse cx="20" cy="40" rx="12" ry="24" fill="url(#scrollGrad)" />
  <ellipse cx="20" cy="40" rx="6" ry="16" fill="#B8860B" opacity="0.4" />

  <!-- Right scroll curl -->
  <ellipse cx="300" cy="40" rx="18" ry="30" fill="url(#scrollEdge)" />
  <ellipse cx="300" cy="40" rx="12" ry="24" fill="url(#scrollGrad)" />
  <ellipse cx="300" cy="40" rx="6" ry="16" fill="#B8860B" opacity="0.4" />

  <!-- Main scroll body -->
  <rect x="18" y="10" width="284" height="60" rx="0" fill="url(#scrollGrad)" />
  <!-- Top and bottom edge lines -->
  <rect x="18" y="10" width="284" height="4" fill="#B8860B" opacity="0.5" />
  <rect x="18" y="66" width="284" height="4" fill="#B8860B" opacity="0.5" />

  <!-- Decorative inner border -->
  <rect x="26" y="15" width="268" height="50" rx="2" fill="none" stroke="#B8860B" stroke-width="1.5" opacity="0.6" />

  <!-- Left laurel branch -->
  <!-- Branch stem -->
  <line x1="55" y1="40" x2="110" y2="40" stroke="#8B6914" stroke-width="1.2" opacity="0.7"/>
  <!-- Leaves left side -->
  <ellipse cx="65" cy="33" rx="8" ry="4" fill="#8B6914" opacity="0.5" transform="rotate(-30,65,33)"/>
  <ellipse cx="78" cy="29" rx="8" ry="4" fill="#8B6914" opacity="0.5" transform="rotate(-15,78,29)"/>
  <ellipse cx="92" cy="27" rx="8" ry="4" fill="#8B6914" opacity="0.5" transform="rotate(0,92,27)"/>
  <ellipse cx="65" cy="47" rx="8" ry="4" fill="#8B6914" opacity="0.5" transform="rotate(30,65,47)"/>
  <ellipse cx="78" cy="51" rx="8" ry="4" fill="#8B6914" opacity="0.5" transform="rotate(15,78,51)"/>
  <ellipse cx="92" cy="53" rx="8" ry="4" fill="#8B6914" opacity="0.5" transform="rotate(0,92,53)"/>

  <!-- Right laurel branch (mirrored) -->
  <line x1="265" y1="40" x2="210" y2="40" stroke="#8B6914" stroke-width="1.2" opacity="0.7"/>
  <ellipse cx="255" cy="33" rx="8" ry="4" fill="#8B6914" opacity="0.5" transform="rotate(30,255,33)"/>
  <ellipse cx="242" cy="29" rx="8" ry="4" fill="#8B6914" opacity="0.5" transform="rotate(15,242,29)"/>
  <ellipse cx="228" cy="27" rx="8" ry="4" fill="#8B6914" opacity="0.5" transform="rotate(0,228,27)"/>
  <ellipse cx="255" cy="47" rx="8" ry="4" fill="#8B6914" opacity="0.5" transform="rotate(-30,255,47)"/>
  <ellipse cx="242" cy="51" rx="8" ry="4" fill="#8B6914" opacity="0.5" transform="rotate(-15,242,51)"/>
  <ellipse cx="228" cy="53" rx="8" ry="4" fill="#8B6914" opacity="0.5" transform="rotate(0,228,53)"/>

  <!-- Centre star -->
  <polygon points="160,22 163.5,32 174,32 165.5,38 168.5,48 160,42 151.5,48 154.5,38 146,32 156.5,32"
           fill="#D4A520" stroke="#8B6914" stroke-width="1"/>

  <!-- "TRUE OR FALSE?" text -->
  <text x="160" y="60" text-anchor="middle" font-family="serif" font-size="12"
        font-weight="bold" fill="#5C3D00" letter-spacing="3" opacity="0.8">TRUE  OR  FALSE?</text>
</svg>
