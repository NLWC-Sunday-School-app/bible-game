<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>Bible Game - Question</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .mi {
    font-family: 'Material Symbols Rounded';
    font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    font-size: 24px; display: inline-block; vertical-align: middle; line-height: 1;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    width: 390px; height: 844px;
    overflow: hidden;
    background: #110F0A;
    color: #F5E6C8;
  }

  body::after {
    content: '';
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0.03; z-index: 999; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  }

  .screen {
    height: 100%; display: flex; flex-direction: column;
    padding: 46px 20px 24px;
    position: relative; z-index: 1;
  }

  /* Ambient */
  .ambient {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .ambient::before {
    content: '';
    position: absolute;
    top: -20%; left: 50%; transform: translateX(-50%);
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(27, 58, 107, 0.15) 0%, transparent 70%);
  }

  .page-label {
    position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(200, 167, 78, 0.1); color: #C8A74E;
    font-size: 9px; font-weight: 800; padding: 2px 10px;
    border-radius: 6px; letter-spacing: 1.2px; text-transform: uppercase;
    z-index: 100; border: 1px solid rgba(200, 167, 78, 0.15);
  }

  /* ===== TOP BAR ===== */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }

  .top-back {
    width: 38px; height: 38px; border-radius: 10px;
    background: rgba(245, 230, 200, 0.06);
    border: 1px solid rgba(245, 230, 200, 0.08);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .top-back .mi { font-size: 20px; color: rgba(245, 230, 200, 0.4); }

  .top-info {
    text-align: center;
  }
  .top-game-name {
    font-size: 10px; font-weight: 800; color: rgba(245, 230, 200, 0.3);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .top-coins {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 13px; font-weight: 700; color: #C8A74E;
  }
  .top-coins .mi { font-size: 14px; }

  /* Timer */
  .timer-box {
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(245, 230, 200, 0.06);
    border: 1px solid rgba(245, 230, 200, 0.08);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .timer-num {
    font-size: 16px; font-weight: 900;
    color: #C8A74E;
  }
  .timer-ring-bg {
    position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px;
    border-radius: 15px;
    border: 2.5px solid rgba(200, 167, 78, 0.15);
  }
  .timer-ring-fill {
    position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px;
    border-radius: 15px;
    border: 2.5px solid #C8A74E;
    border-right-color: transparent;
    border-bottom-color: transparent;
    transition: border-color 0.5s;
    animation: timerSpin 8s linear infinite;
  }
  @keyframes timerSpin {
    to { transform: rotate(360deg); }
  }

  /* ===== QUESTION NUMBER ===== */
  .q-num-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 20px;
  }
  .q-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(245, 230, 200, 0.1);
    transition: all 0.3s;
  }
  .q-dot.done { background: #4A8A5A; }
  .q-dot.now {
    width: 28px; border-radius: 4px;
    background: #C8A74E;
  }

  /* ===== QUESTION CARD ===== */
  .q-card {
    background: linear-gradient(150deg, #1E1812, #1A1610);
    border: 1px solid rgba(245, 230, 200, 0.08);
    border-radius: 20px;
    padding: 28px 22px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  /* Decorative corner flourish */
  .q-card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 50px; height: 50px;
    border-top: 2px solid rgba(200, 167, 78, 0.12);
    border-left: 2px solid rgba(200, 167, 78, 0.12);
    border-radius: 20px 0 0 0;
  }
  .q-card::after {
    content: '';
    position: absolute; bottom: 0; right: 0;
    width: 50px; height: 50px;
    border-bottom: 2px solid rgba(200, 167, 78, 0.12);
    border-right: 2px solid rgba(200, 167, 78, 0.12);
    border-radius: 0 0 20px 0;
  }

  .q-category {
    font-size: 10px; font-weight: 800; color: #C8A74E;
    text-transform: uppercase; letter-spacing: 1.2px;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 4px;
  }
  .q-category .mi { font-size: 13px; }

  .q-text {
    font-family: 'Playfair Display', serif;
    font-size: 20px; font-weight: 700;
    color: #F5E6C8;
    line-height: 1.45;
  }

  /* ===== OPTIONS ===== */
  .opts { display: flex; flex-direction: column; gap: 8px; }

  .opt {
    display: flex; align-items: center; gap: 12px;
    background: rgba(245, 230, 200, 0.05);
    border: 1.5px solid rgba(245, 230, 200, 0.08);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.15s ease-out;
  }
  .opt:hover { background: rgba(245, 230, 200, 0.08); border-color: rgba(245, 230, 200, 0.15); }
  .opt:active:not(.ok):not(.no) { transform: scale(0.98); }

  .opt-letter {
    width: 32px; height: 32px; border-radius: 9px;
    background: rgba(245, 230, 200, 0.06);
    border: 1.5px solid rgba(245, 230, 200, 0.12);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: rgba(245, 230, 200, 0.5);
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .opt-text { flex: 1; font-size: 15px; font-weight: 700; color: #F5E6C8; }
  .opt-result {
    opacity: 0; transform: scale(0);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .opt-result .mi { font-size: 20px; }

  /* Correct */
  .opt.ok {
    background: rgba(74, 138, 90, 0.2);
    border-color: #4A8A5A;
    box-shadow: 0 0 20px rgba(74, 138, 90, 0.1);
  }
  .opt.ok .opt-letter { background: #4A8A5A; border-color: #4A8A5A; color: #fff; }
  .opt.ok .opt-result { opacity: 1; transform: scale(1); }
  .opt.ok .opt-result .mi { color: #6ABA7A; }

  /* Wrong */
  .opt.no {
    background: rgba(155, 60, 60, 0.2);
    border-color: #9B3C3C;
    animation: shake 0.35s ease-in-out;
  }
  .opt.no .opt-letter { background: #9B3C3C; border-color: #9B3C3C; color: #fff; }
  .opt.no .opt-result { opacity: 1; transform: scale(1); }
  .opt.no .opt-result .mi { color: #DB6A6A; }

  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 50%{transform:translateX(5px)} 75%{transform:translateX(-3px)} }

  .opt.dim { opacity: 0.25; pointer-events: none; }

  /* ===== FOOTER ===== */
  .g-foot {
    margin-top: auto; padding-top: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }

  .f-btn {
    display: flex; align-items: center; gap: 4px;
    padding: 10px 18px; border-radius: 10px;
    font-family: 'DM Sans'; font-weight: 700; font-size: 13px;
    cursor: pointer; border: none;
    transition: all 0.1s;
  }
  .f-btn:active { transform: translateY(1px); }
  .f-btn .mi { font-size: 16px; }

  .f-quit {
    background: rgba(245, 230, 200, 0.05);
    color: rgba(245, 230, 200, 0.3);
    border: 1px solid rgba(245, 230, 200, 0.06);
  }
  .f-skip {
    background: rgba(200, 167, 78, 0.1);
    color: #C8A74E;
    border: 1px solid rgba(200, 167, 78, 0.15);
  }

  /* Points */
  .pts {
    position: fixed;
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 900;
    color: #C8A74E;
    pointer-events: none; opacity: 0; z-index: 50;
    text-shadow: 0 0 20px rgba(200, 167, 78, 0.4);
  }
  .pts.go { animation: fly 0.9s ease-out forwards; }
  @keyframes fly { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-70px) scale(1.3)} }
</style>
</head>
<body>

<div class="page-label">Quick Game</div>
<div class="ambient"></div>

<div class="screen">
  <div class="top-bar">
    <div class="top-back"><span class="mi">close</span></div>
    <div class="top-info">
      <div class="top-game-name">Quick Game</div>
      <div class="top-coins"><span class="mi" style="font-size:14px">toll</span> 2,450</div>
    </div>
    <div class="timer-box">
      <div class="timer-ring-bg"></div>
      <div class="timer-ring-fill" id="trf"></div>
      <div class="timer-num" id="tn">22</div>
    </div>
  </div>

  <div class="q-num-row">
    <div class="q-dot done"></div>
    <div class="q-dot now"></div>
    <div class="q-dot"></div>
    <div class="q-dot"></div>
  </div>

  <div class="q-card">
    <div class="q-category"><span class="mi">bookmark</span> Old Testament</div>
    <div class="q-text">Who built the ark as instructed by God to survive the great flood?</div>
  </div>

  <div class="opts">
    <div class="opt" data-c="0" onclick="pick(this)">
      <div class="opt-letter">A</div>
      <div class="opt-text">Abraham</div>
      <div class="opt-result"><span class="mi">close</span></div>
    </div>
    <div class="opt" data-c="1" onclick="pick(this)">
      <div class="opt-letter">B</div>
      <div class="opt-text">Noah</div>
      <div class="opt-result"><span class="mi">check</span></div>
    </div>
    <div class="opt" data-c="0" onclick="pick(this)">
      <div class="opt-letter">C</div>
      <div class="opt-text">Moses</div>
      <div class="opt-result"><span class="mi">close</span></div>
    </div>
    <div class="opt" data-c="0" onclick="pick(this)">
      <div class="opt-letter">D</div>
      <div class="opt-text">David</div>
      <div class="opt-result"><span class="mi">close</span></div>
    </div>
  </div>

  <div class="g-foot">
    <button class="f-btn f-quit"><span class="mi">logout</span> Quit</button>
    <button class="f-btn f-skip">Skip <span class="mi">skip_next</span></button>
  </div>
</div>

<div class="pts" id="pts">+10</div>

<script>
  let done=false;
  function pick(el){
    if(done)return; done=true;
    const ok=el.dataset.c==='1';
    const all=document.querySelectorAll('.opt');
    if(ok){
      el.classList.add('ok');
      all.forEach(o=>{if(o!==el)o.classList.add('dim')});
      const r=el.getBoundingClientRect(),p=document.getElementById('pts');
      p.style.left=(r.left+r.width/2-20)+'px'; p.style.top=(r.top-5)+'px';
      p.classList.add('go');
    } else {
      el.classList.add('no');
      all.forEach(o=>{
        if(o.dataset.c==='1')o.classList.add('ok');
        else if(o!==el)o.classList.add('dim');
      });
    }
  }

  let t=22;
  setInterval(()=>{
    if(t<=0||done)return; t--;
    document.getElementById('tn').textContent=t;
    if(t<=5){
      document.getElementById('tn').style.color='#C84C4C';
      document.getElementById('trf').style.borderColor='#C84C4C';
      document.getElementById('trf').style.borderRightColor='transparent';
      document.getElementById('trf').style.borderBottomColor='transparent';
    }
  },1000);
</script>
</body>
</html>
