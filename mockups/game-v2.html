<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>Bible Game - Game (Cathedral)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .mi {
    font-family: 'Material Symbols Rounded';
    font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
    font-size: 24px; display: inline-block; vertical-align: middle; line-height: 1;
  }

  body {
    font-family: 'Inter', sans-serif;
    width: 390px; height: 844px;
    overflow: hidden;
    background: #08090E;
    color: #E8E4F0;
  }

  .screen {
    height: 100%; display: flex; flex-direction: column;
    padding: 46px 18px 22px;
    position: relative; z-index: 1;
  }

  /* Light bleeds */
  .lb {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .lb::before {
    content: '';
    position: absolute; top: -5%; left: 40%;
    width: 180px; height: 250px;
    background: radial-gradient(ellipse, rgba(30, 64, 175, 0.08) 0%, transparent 70%);
  }

  .page-label {
    position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    background: rgba(124, 58, 237, 0.1); color: #A78BFA;
    font-size: 9px; font-weight: 800; padding: 2px 10px;
    border-radius: 6px; letter-spacing: 1.2px; text-transform: uppercase;
    z-index: 100; border: 1px solid rgba(124, 58, 237, 0.15);
  }

  /* ===== TOP BAR ===== */
  .tbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .tbar-btn {
    width: 40px; height: 40px; border-radius: 11px;
    background: rgba(232, 228, 240, 0.04);
    border: 1px solid rgba(232, 228, 240, 0.06);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .tbar-btn .mi { font-size: 20px; color: rgba(232, 228, 240, 0.35); }

  .tbar-center { text-align: center; }
  .tbar-label {
    font-size: 10px; font-weight: 800; color: rgba(232, 228, 240, 0.25);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .tbar-coins {
    display: flex; align-items: center; justify-content: center; gap: 3px;
    font-size: 14px; font-weight: 800; color: #FBBF24;
  }
  .tbar-coins .mi { font-size: 15px; }

  /* Timer - jewel ring */
  .timer {
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(232, 228, 240, 0.04);
    border: 1px solid rgba(232, 228, 240, 0.06);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .timer-num { font-size: 17px; font-weight: 900; color: #A78BFA; }
  .timer-glow {
    position: absolute; inset: -2px; border-radius: 14px;
    border: 2px solid rgba(167, 139, 250, 0.2);
    animation: pulseGlow 2s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { border-color: rgba(167, 139, 250, 0.2); box-shadow: 0 0 0 rgba(167, 139, 250, 0); }
    50% { border-color: rgba(167, 139, 250, 0.4); box-shadow: 0 0 12px rgba(167, 139, 250, 0.1); }
  }

  /* ===== PROGRESS ===== */
  .progress {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-bottom: 22px;
  }
  .pdot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(232, 228, 240, 0.08);
    transition: all 0.3s;
  }
  .pdot.done { background: #22C55E; box-shadow: 0 0 6px rgba(34, 197, 94, 0.2); }
  .pdot.now { width: 26px; border-radius: 4px; background: #A78BFA; box-shadow: 0 0 8px rgba(167, 139, 250, 0.2); }

  /* ===== QUESTION ===== */
  .qcard {
    border-radius: 20px;
    padding: 26px 20px;
    margin-bottom: 22px;
    background: rgba(232, 228, 240, 0.03);
    border: 1px solid rgba(232, 228, 240, 0.06);
    position: relative;
    overflow: hidden;
  }
  /* Arch-shaped decorative top — like a cathedral window */
  .qcard::before {
    content: '';
    position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 1px solid rgba(167, 139, 250, 0.06);
  }
  .qcard::after {
    content: '';
    position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
    width: 160px; height: 160px;
    border-radius: 50%;
    border: 1px solid rgba(167, 139, 250, 0.03);
  }

  .qcat {
    font-size: 10px; font-weight: 800; color: #A78BFA;
    text-transform: uppercase; letter-spacing: 1.2px;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 4px;
    position: relative; z-index: 1;
  }
  .qcat .mi { font-size: 13px; }

  .qtxt {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 600;
    line-height: 1.4;
    position: relative; z-index: 1;
  }

  /* ===== OPTIONS ===== */
  .opts { display: flex; flex-direction: column; gap: 8px; }

  .opt {
    display: flex; align-items: center; gap: 12px;
    background: rgba(232, 228, 240, 0.04);
    border: 1.5px solid rgba(232, 228, 240, 0.06);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.15s ease-out;
  }
  .opt:hover { background: rgba(232, 228, 240, 0.07); border-color: rgba(232, 228, 240, 0.1); }
  .opt:active:not(.ok):not(.no) { transform: scale(0.98); }

  .ol {
    width: 32px; height: 32px; border-radius: 9px;
    background: rgba(232, 228, 240, 0.05);
    border: 1.5px solid rgba(232, 228, 240, 0.08);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: rgba(232, 228, 240, 0.4);
    flex-shrink: 0; transition: all 0.2s;
  }
  .ot { flex: 1; font-size: 15px; font-weight: 700; }
  .or {
    opacity: 0; transform: scale(0);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .or .mi { font-size: 20px; }

  /* Correct - emerald glow */
  .opt.ok {
    background: rgba(34, 197, 94, 0.1);
    border-color: rgba(34, 197, 94, 0.3);
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.06), inset 0 0 20px rgba(34, 197, 94, 0.03);
  }
  .opt.ok .ol { background: #22C55E; border-color: #22C55E; color: #fff; box-shadow: 0 0 10px rgba(34, 197, 94, 0.3); }
  .opt.ok .or { opacity: 1; transform: scale(1); }
  .opt.ok .or .mi { color: #4ADE80; }

  /* Wrong - ruby glow */
  .opt.no {
    background: rgba(239, 68, 68, 0.08);
    border-color: rgba(239, 68, 68, 0.25);
    animation: shake 0.35s ease-in-out;
  }
  .opt.no .ol { background: #EF4444; border-color: #EF4444; color: #fff; box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
  .opt.no .or { opacity: 1; transform: scale(1); }
  .opt.no .or .mi { color: #FCA5A5; }

  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 50%{transform:translateX(5px)} 75%{transform:translateX(-3px)} }

  .opt.dim { opacity: 0.2; pointer-events: none; }

  /* ===== FOOTER ===== */
  .gfoot {
    margin-top: auto; padding-top: 14px;
    display: flex; justify-content: space-between;
  }
  .fb {
    display: flex; align-items: center; gap: 4px;
    padding: 9px 16px; border-radius: 10px;
    font-family: 'Inter'; font-weight: 700; font-size: 13px;
    cursor: pointer; border: none; transition: all 0.1s;
  }
  .fb:active { transform: translateY(1px); }
  .fb .mi { font-size: 16px; }
  .fb-q { background: rgba(232, 228, 240, 0.04); color: rgba(232, 228, 240, 0.25); border: 1px solid rgba(232, 228, 240, 0.05); }
  .fb-s { background: rgba(167, 139, 250, 0.08); color: #A78BFA; border: 1px solid rgba(167, 139, 250, 0.1); }

  /* Points */
  .pts {
    position: fixed;
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 700;
    color: #FBBF24;
    pointer-events: none; opacity: 0; z-index: 50;
    text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
  }
  .pts.go { animation: fly 0.9s ease-out forwards; }
  @keyframes fly { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-60px) scale(1.2)} }
</style>
</head>
<body>

<div class="page-label">Quick Game</div>
<div class="lb"></div>

<div class="screen">
  <div class="tbar">
    <div class="tbar-btn"><span class="mi">close</span></div>
    <div class="tbar-center">
      <div class="tbar-label">Quick Game</div>
      <div class="tbar-coins"><span class="mi">toll</span> 2,450</div>
    </div>
    <div class="timer">
      <div class="timer-glow"></div>
      <div class="timer-num" id="tn">22</div>
    </div>
  </div>

  <div class="progress">
    <div class="pdot done"></div>
    <div class="pdot now"></div>
    <div class="pdot"></div>
    <div class="pdot"></div>
  </div>

  <div class="qcard">
    <div class="qcat"><span class="mi">bookmark</span> Old Testament</div>
    <div class="qtxt">Who built the ark as instructed by God to survive the great flood?</div>
  </div>

  <div class="opts">
    <div class="opt" data-c="0" onclick="pick(this)">
      <div class="ol">A</div>
      <div class="ot">Abraham</div>
      <div class="or"><span class="mi">close</span></div>
    </div>
    <div class="opt" data-c="1" onclick="pick(this)">
      <div class="ol">B</div>
      <div class="ot">Noah</div>
      <div class="or"><span class="mi">check</span></div>
    </div>
    <div class="opt" data-c="0" onclick="pick(this)">
      <div class="ol">C</div>
      <div class="ot">Moses</div>
      <div class="or"><span class="mi">close</span></div>
    </div>
    <div class="opt" data-c="0" onclick="pick(this)">
      <div class="ol">D</div>
      <div class="ot">David</div>
      <div class="or"><span class="mi">close</span></div>
    </div>
  </div>

  <div class="gfoot">
    <button class="fb fb-q"><span class="mi">logout</span> Quit</button>
    <button class="fb fb-s">Skip <span class="mi">skip_next</span></button>
  </div>
</div>

<div class="pts" id="pts">+10</div>

<script>
  let done=false;
  function pick(el){
    if(done)return; done=true;
    const ok=el.dataset.c==='1';
    const all=document.querySelectorAll('.opt');
    if(ok){
      el.classList.add('ok');
      all.forEach(o=>{if(o!==el)o.classList.add('dim')});
      const r=el.getBoundingClientRect(),p=document.getElementById('pts');
      p.style.left=(r.left+r.width/2-20)+'px'; p.style.top=(r.top-5)+'px';
      p.classList.add('go');
    } else {
      el.classList.add('no');
      all.forEach(o=>{
        if(o.dataset.c==='1')o.classList.add('ok');
        else if(o!==el)o.classList.add('dim');
      });
    }
  }
  let t=22;
  setInterval(()=>{
    if(t<=0||done)return; t--;
    document.getElementById('tn').textContent=t;
    if(t<=5){ document.getElementById('tn').style.color='#FCA5A5'; }
  },1000);
</script>
</body>
</html>
