allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.scijava.org/content/repositories/public/' }
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

// Fix for plugins that don't declare a namespace (required by AGP 8+)
subprojects { sub ->
    sub.pluginManager.withPlugin('com.android.library') {
        sub.android {
            if (namespace == null || namespace.isEmpty()) {
                def manifest = file("${sub.projectDir}/src/main/AndroidManifest.xml")
                if (manifest.exists()) {
                    def packageName = new XmlParser().parse(manifest).attribute('package')
                    if (packageName) {
                        namespace = packageName
                    }
                }
            }
        }
    }
}


tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
