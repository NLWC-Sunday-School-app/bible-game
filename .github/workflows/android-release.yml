name: Android Release Build

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'  # Match your local version
          channel: 'stable'
          
      - name: Get dependencies
        run: flutter pub get
        
      - name: Extract and increment version
        id: version
        run: |
          # Extract version from pubspec.yaml (e.g., "2.2.12+32")
          VERSION_LINE=$(grep "^version:" pubspec.yaml | head -n 1)
          VERSION_FULL=$(echo $VERSION_LINE | sed 's/version: //')
          
          # Split into version name and version code
          VERSION_NAME=$(echo $VERSION_FULL | cut -d'+' -f1)
          VERSION_CODE=$(echo $VERSION_FULL | cut -d'+' -f2)
          
          # Increment version code
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          
          echo "Original version: $VERSION_NAME+$VERSION_CODE"
          echo "New version: $VERSION_NAME+$NEW_VERSION_CODE"
          
          # Export for use in subsequent steps
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "full_version=$VERSION_NAME+$NEW_VERSION_CODE" >> $GITHUB_OUTPUT
        
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > game-keystore.jks
          cp game-keystore.jks android/app/game-keystore.jks
          
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=game-keystore.jks
          EOF
          
      - name: Build Android App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.version_code }}
        
      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-playstore:
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.nlwc.bible.game
          releaseFiles: app-release.aab
          track: internal
          status: completed
